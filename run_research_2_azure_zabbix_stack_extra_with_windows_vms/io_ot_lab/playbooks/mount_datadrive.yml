---
# Version: 3.6.1
# Description: Dynamically inspects, partitions, formats, and persistently mounts a secondary storage device to a configurable directory for database servers.

- name: Inspect, configure, and mount dynamic data drive
  hosts: db_servers
  gather_facts: true
  become: true
  tasks:
    - name: Ensure required variables are defined
      ansible.builtin.assert:
        that:
          - data_device is defined
          - data_dir is defined
        fail_msg: "Both 'data_device' and 'data_dir' must be defined for this host in the inventory."

    - name: Gather block device information with size
      ansible.builtin.command: lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINTS
      register: block_devices
      changed_when: false
      check_mode: false

    - name: Display available block devices
      ansible.builtin.debug:
        msg: "{{ block_devices.stdout_lines }}"

    - name: Create primary partition on target device
      community.general.parted:
        device: "{{ data_device }}"
        number: 1
        state: present
        fs_type: ext4

    - name: Create ext4 filesystem on target partition
      ansible.builtin.filesystem:
        fstype: ext4
        dev: "{{ data_device }}1"

    - name: Ensure mount point directory exists
      ansible.builtin.file:
        path: "{{ data_dir }}"
        state: directory
        mode: '0755'

    - name: Mount secondary drive persistently
      ansible.builtin.mount:
        path: "{{ data_dir }}"
        src: "{{ data_device }}1"
        fstype: ext4
        opts: defaults
        state: mounted