---
# Version: 3.4.1
# Author: aspen
# Description: Inspects block devices, creates a primary partition on sda, formats as ext4, and persistently mounts to /var/lib/mysql on db_servers.

- name: Inspect, configure, and mount secondary data drive
  hosts: db_servers
  gather_facts: true
  become: true
  tasks:
    - name: Gather block device information with size
      ansible.builtin.command: lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINTS
      register: block_devices
      changed_when: false
      check_mode: false

    - name: Display available block devices
      ansible.builtin.debug:
        msg: "{{ block_devices.stdout_lines }}"

    - name: Create primary partition on sda
      community.general.parted:
        device: /dev/sda
        number: 1
        state: present
        fs_type: ext4

    - name: Create ext4 filesystem on sda1
      ansible.builtin.filesystem:
        fstype: ext4
        dev: /dev/sda1

    - name: Ensure mount point directory exists
      ansible.builtin.file:
        path: /var/lib/mysql
        state: directory
        mode: '0755'

    - name: Mount secondary drive persistently
      ansible.builtin.mount:
        path: /var/lib/mysql
        src: /dev/sda1
        fstype: ext4
        opts: defaults
        state: mounted