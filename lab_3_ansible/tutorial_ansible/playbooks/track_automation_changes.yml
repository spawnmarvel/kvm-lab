# Version: 1.0.0
# Description: Ensures /op_ansible/automation.log exists with specified text content using the copy module
# We update the file content to keep a log of the automation tasks performed on the target system. 
# The copy module is used to create or update the file with the specified content.
# We use a user prompt to allow the user to specify the log entry to be appended to the file.

- name: Manage Target System File
  hosts: myhost
  vars_prompt:
    - name: "log_entry"
      prompt: "Please enter the log entry to append to /op_ansible/automation.log:"
      private: no

  become: true
  vars:
    automation_log_content: "{{ ansible_facts['date_time']['iso8601'] }} {{ log_entry }}"
  tasks:
    - name: Ensure /op_ansible directory exists
      ansible.builtin.file:
        path: /op_ansible
        state: directory
        # 755 means read, write, and execute permissions for the owner, and read and execute permissions for the group and others.
        mode: '0755'
        
    - name: Append log entry directly to /op_ansible/automation.log
      ansible.builtin.shell: "echo '{{ automation_log_content }}' >> /op_ansible/automation.log"